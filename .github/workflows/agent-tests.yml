# GitHub Actions workflow for agent testing

name: Agent Tests

on:
  push:
    branches: [main]
    paths:
      - 'agents/**'
      - 'runtime/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/agent-tests.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  MOCK_BEDROCK: 'true'

jobs:
  test:
    name: Run Agent Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-html pytest-asyncio pytest-cov

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run tests with reports
        id: pytest
        continue-on-error: true
        env:
          MOCK_BEDROCK: 'true'
          AWS_REGION: ${{ secrets.AWS_REGION }}
          BEDROCK_MODEL_ID: ${{ secrets.BEDROCK_MODEL_ID }}
        run: |
          pytest tests/ -v \
            --html=reports/report.html \
            --self-contained-html \
            --junitxml=reports/junit.xml \
            --tb=short \
            2>&1 | tee reports/test-output.txt

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: reports/
          retention-days: 30

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: reports/junit.xml
          check_name: Test Results
          comment_mode: always
          fail_on: nothing

      - name: Test Summary
        if: always()
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/junit.xml ]; then
            echo "### JUnit Report" >> $GITHUB_STEP_SUMMARY
            echo "Test report uploaded as artifact: test-reports" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -50 reports/test-output.txt >> $GITHUB_STEP_SUMMARY || echo "No output captured" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Check test results
        if: steps.pytest.outcome == 'failure'
        run: |
          echo "::warning::Some tests failed. Check the test reports for details."
          echo "Tests completed with failures - this is expected for demonstration purposes."

  docker-test:
    name: Docker Test Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: qa-agentic-poc:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests in Docker
        run: |
          docker run --rm \
            -e MOCK_BEDROCK=true \
            -v $(pwd)/reports:/app/reports \
            qa-agentic-poc:test

      - name: Upload Docker test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-test-reports
          path: reports/
          retention-days: 30
